{% extends "base.html" %}

{% block title %}Forbidden - WeatherHub{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Access Forbidden</h2>
        <p class="error-message">You do not have permission to access this resource.</p>
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Go Back
        </a>
    </div>
</div>
{% endblock %}
