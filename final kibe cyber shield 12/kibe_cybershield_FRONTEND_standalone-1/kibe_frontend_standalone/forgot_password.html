<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Kibe CyberShield</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
</head>
<body>
<div id="flashMessages" style="display:none;"></div>

<div class="auth-page" style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--c-bg);">
  <div class="auth-card" style="width:100%;max-width:440px;padding:var(--gap-xl);">

    <a href="login.html" class="auth-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M20 2L4 10v12c0 9.4 6.8 18.2 16 20 9.2-1.8 16-10.6 16-20V10L20 2z" fill="#00C2FF" opacity="0.15"/>
          <path d="M20 2L4 10v12c0 9.4 6.8 18.2 16 20 9.2-1.8 16-10.6 16-20V10L20 2z" stroke="#00C2FF" stroke-width="1.5" fill="none"/>
          <path d="M14 20l4 4 8-8" stroke="#00C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Kibe<span class="accent">Cyber</span>Shield</span>
    </a>

    <div class="auth-header" style="margin-bottom:var(--gap-xl);">
      <h1 style="font-family:var(--font-head);font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:8px;">Forgot Password</h1>
      <p style="color:var(--c-text2);font-size:0.9rem;">Enter your email address and we'll send you a reset link.</p>
    </div>

    <form method="POST" action="forgot_password.html">

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-group">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" name="email" class="form-input"
                 placeholder="your@email.com" autocomplete="email" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>

    <div class="auth-footer" style="text-align:center;margin-top:var(--gap-lg);color:var(--c-text3);font-size:0.875rem;">
      Remember your password? <a href="login.html" style="color:var(--c-cyan);font-weight:500;">Sign in →</a>
    </div>
  </div>
</div>



  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
