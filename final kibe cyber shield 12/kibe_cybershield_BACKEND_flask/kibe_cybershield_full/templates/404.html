<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Kibe CyberShield</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px;background:var(--c-bg);">
  <div style="font-family:var(--font-mono);font-size:5rem;font-weight:800;color:var(--c-cyan);opacity:0.3;line-height:1;">404</div>
  <h1 style="font-family:var(--font-head);font-size:2rem;font-weight:700;color:#fff;margin:16px 0 8px;">Page Not Found</h1>
  <p style="color:var(--c-text2);margin-bottom:32px;max-width:400px;">The page you're looking for doesn't exist or has been moved.</p>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
    <a href="{{ url_for('index') }}" class="btn-primary">← Back to Home</a>
    <a href="{{ url_for('dashboard') }}" class="btn-ghost">Dashboard</a>
  </div>
</div>
</body>
</html>
